<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>MarkenX Student</h1>
      <p>Sistema de Gestión de Tareas</p>
    </div>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-field">
        <label for="email">Email</label>
        <input 
          id="email" 
          type="email" 
          pInputText
          formControlName="email"
          placeholder="estudiante@udla.edu.ec"
          [class.p-invalid]="email?.invalid && email?.touched"
          class="w-full"
        />
        <small 
          *ngIf="email?.invalid && email?.touched" 
          class="p-error">
          Email es requerido y debe ser válido
        </small>
      </div>

      <div class="form-field">
        <label for="password">Contraseña</label>
        <input 
          id="password" 
          type="password" 
          pInputText
          formControlName="password"
          placeholder="••••••••"
          [class.p-invalid]="password?.invalid && password?.touched"
          class="w-full"
        />
        <small 
          *ngIf="password?.invalid && password?.touched" 
          class="p-error">
          Contraseña es requerida (mínimo 6 caracteres)
        </small>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        <i class="pi pi-exclamation-triangle"></i>
        {{ errorMessage }}
      </div>

      <button 
        pButton
        type="submit" 
        label="Iniciar Sesión" 
        icon="pi pi-sign-in"
        [disabled]="loginForm.invalid || loading"
        [loading]="loading"
        class="w-full login-button">
      </button>
    </form>
  </div>
</div>
